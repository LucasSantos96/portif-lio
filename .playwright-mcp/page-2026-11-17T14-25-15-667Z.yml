      - region "Timeline" [ref=f1e87]:
        - generic [ref=f1e88]:
          - heading "Timeline" [level=2] [ref=f1e89]
          - paragraph [ref=f1e90]: The main updates to the project, from the most recent to the oldest.
        - list [ref=f1e91]:
          - listitem [ref=f1e92]:
            - time [ref=f1e94]: November 2026
            - 'heading "New omnichannel inbox: lead panel and rich media" [level=3] [ref=f1e95]'
            - paragraph [ref=f1e96]: "The conversation screen was rebuilt in the V2 look: floating header and composer, a side panel with the funnel stage, the case details and shared media, and clearly labeled AI messages. Audio gets a waveform player with transcription, images become a zoomable album, documents show type and page count, and several attachments can be sent at once by dragging them into the chat."
            - list [ref=f1e97]:
              - listitem [ref=f1e98]:
                - 'button "Enlarge image for New omnichannel inbox: lead panel and rich media" [ref=f1e99]':
                  - 'img "MeuAssis: New omnichannel inbox: lead panel and rich media" [ref=f1e100]'
          - listitem [ref=f1e101]:
            - time [ref=f1e103]: November 2026
            - heading "Guided onboarding, support with feedback and video tutorials" [level=3] [ref=f1e104]
            - paragraph [ref=f1e105]: A step-by-step first-access wizard with a checklist, team invitations by email, support with audio, attachments and rating of the answer, and a library of V2 video lessons produced programmatically (script, narration and screenshots generated by code).
          - listitem [ref=f1e106]:
            - time [ref=f1e108]: November 2026
            - heading "Basic and Pro plans and signed contracts in Google Drive" [level=3] [ref=f1e109]
            - paragraph [ref=f1e110]: "Per-firm plans: Basic delivers CRM and support without AI, Pro unlocks automations and media understanding. A Google Drive integration automatically files signed contracts in the chosen folder."
            - list [ref=f1e111]:
              - listitem [ref=f1e112]:
                - button "Enlarge image for Basic and Pro plans and signed contracts in Google Drive" [ref=f1e113]:
                  - 'img "MeuAssis: Basic and Pro plans and signed contracts in Google Drive" [ref=f1e114]'
          - listitem [ref=f1e115]:
            - time [ref=f1e117]: October 2026
            - heading "Installable app with notifications and observability" [level=3] [ref=f1e118]
            - paragraph [ref=f1e119]: The platform became a PWA, with push notifications for contracts and meetings on the phone. On the operations side, it gained an audit trail for management actions and system health metrics to diagnose issues before customers notice.
          - listitem [ref=f1e120]:
            - time [ref=f1e122]: October 2026
            - heading "AI rebuilt on LangGraph, with per-area agents" [level=3] [ref=f1e123]
            - paragraph [ref=f1e124]: The AI attendant became a graph of dedicated agents per legal area, with handoff between them, a model chain with fallback and schema-based structured output. More predictable, easier to test and to evolve.
          - listitem [ref=f1e125]:
            - time [ref=f1e127]: October 2026
            - 'heading "V2: full redesign and a new design system" [level=3] [ref=f1e128]'
            - paragraph [ref=f1e129]: "Nine phases of work: design tokens, primitive components, new navigation, a what's-new tour, dashboard, login, contracts and automations. V2 ships with light and dark themes, WCAG AA contrast, visible focus, reduced-motion support and responsiveness and accessibility tests."
            - list [ref=f1e130]:
              - listitem [ref=f1e131]:
                - 'button "Enlarge image for V2: full redesign and a new design system" [ref=f1e132]':
                  - 'img "MeuAssis: V2: full redesign and a new design system" [ref=f1e133]'
          - listitem [ref=f1e134]:
            - time [ref=f1e136]: September 2026
            - heading "Ad attribution and Meta Ads conversions" [level=3] [ref=f1e137]
            - paragraph [ref=f1e138]: The CRM now records which ad each conversation came from and sends conversions (qualified leads) back to the Pixel through the Conversions API. The firm sees the real return on paid traffic, not just clicks.
          - listitem [ref=f1e139]:
            - time [ref=f1e141]: August 2026
            - heading "Third channel, synced history and a task board" [level=3] [ref=f1e142]
            - paragraph [ref=f1e143]: Support for a third WhatsApp number with its own permissions (partners and correspondents), conversation history sync and a per-collaborator Kanban task board linked to contacts.
          - listitem [ref=f1e144]:
            - time [ref=f1e146]: June 2026
            - heading "Instagram in the same inbox and audio transcription" [level=3] [ref=f1e147]
            - paragraph [ref=f1e148]: Instagram messages land in the same inbox as WhatsApp, handled by the AI and the team. Incoming audio is transcribed automatically before the AI replies, using async queues (BullMQ) so support never stalls.
          - listitem [ref=f1e149]:
            - time [ref=f1e151]: May 2026
            - heading "AI attendant and automatic follow-up" [level=3] [ref=f1e152]
            - paragraph [ref=f1e153]: A virtual attendant triages, qualifies the lead by legal area and books the meeting; the team takes over when needed. Scheduled follow-ups revive stalled conversations, with a circuit breaker that pauses the AI after consecutive failures.
          - listitem [ref=f1e154]:
            - time [ref=f1e156]: April 2026
            - heading "Contracts with e-signature (ZapSign)" [level=3] [ref=f1e157]
            - paragraph [ref=f1e158]: Contract generation from templates and signature status tracking inside the platform, synced with ZapSign. Closing a client no longer depends on email and spreadsheets.
          - listitem [ref=f1e159]:
            - time [ref=f1e161]: April 2026
            - heading "Omnichannel support on WhatsApp and an integrated calendar" [level=3] [ref=f1e162]
            - paragraph [ref=f1e163]: WhatsApp connection through a QR code, a real-time inbox with assignment to attendants, and two-way sync with Google Calendar. Every conversation becomes a lead tracked in the funnel, with no tool switching.
          - listitem [ref=f1e164]:
            - time [ref=f1e166]: March 2026
            - 'heading "The platform is born: ERP, CRM and AI in one place" [level=3] [ref=f1e167]'
            - paragraph [ref=f1e168]: First version with navigation, login, dashboard, funnel CRM, support, contracts, relationship tracking and help desk. The architecture was then consolidated into a modular monolith (NestJS + PostgreSQL + Prisma) with a Next.js front end and per-firm isolation (multi-tenant).
